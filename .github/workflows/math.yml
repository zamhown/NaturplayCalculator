name: NaturplayMath checks
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  math:
    name: Math / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: math/**/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore math/NaturplayMath.sln --locked-mode
      - name: Test mathematical invariants and regressions
        run: dotnet test math/NaturplayMath.sln --no-restore --configuration Release --blame-hang-timeout 2m --logger trx --results-directory artifacts/math-tests
      - name: Run public API example
        run: dotnet run --project math/samples/NaturplayMath.Demo/NaturplayMath.Demo.csproj --no-restore --configuration Release
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-tests-${{ matrix.os }}
          path: artifacts/math-tests/**/*.trx
          retention-days: 14
