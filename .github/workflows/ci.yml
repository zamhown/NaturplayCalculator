name: Calculator checks
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: ./scripts/check-repo.ps1
      - run: ./scripts/check-workflows.ps1

  portable:
    name: Portable / ${{ matrix.os }}
    needs: repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: ncalc/**/packages*.lock.json
      - name: Test script success and failure paths
        run: ./scripts/test-scripts.ps1
      - name: Test portable libraries
        run: ./scripts/check.ps1 -CoreOnly -Configuration Release
      - name: Publish and run native smoke on this OS
        if: runner.os != 'Windows'
        run: ./scripts/check-aot.ps1
      - name: Upload portable diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ matrix.os }}
          path: |
            artifacts/tests/**/*.trx
            artifacts/checks/*.log
          retention-days: 14

  regression-and-winui:
    name: WinUI / ${{ matrix.target.platform }} / ${{ matrix.configuration }}
    needs: repository
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        target:
          - { platform: x64, runner: windows-2025-vs2026 }
          - { platform: x86, runner: windows-2025-vs2026 }
          - { platform: ARM64, runner: windows-11-vs2026-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: ncalc/**/packages*.lock.json
      - name: Test and build without signing credentials
        env:
          TARGET_CONFIGURATION: ${{ matrix.configuration }}
          TARGET_PLATFORM: ${{ matrix.target.platform }}
        run: ./scripts/check.ps1 -Configuration $env:TARGET_CONFIGURATION -Platform $env:TARGET_PLATFORM
      - name: Publish and execute native smoke for the target architecture
        if: matrix.configuration == 'Release'
        env:
          TARGET_PLATFORM: ${{ matrix.target.platform }}
        run: ./scripts/check-aot.ps1 -RuntimeIdentifier "win-$($env:TARGET_PLATFORM.ToLowerInvariant())"
      - name: Upload tests and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-${{ matrix.target.platform }}-${{ matrix.configuration }}
          path: |
            artifacts/tests/**/*.trx
            artifacts/checks/*.log
          retention-days: 14
      - name: Upload verified unsigned Native AOT package
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msix-${{ matrix.target.platform }}
          path: ncalc/NaturplayCalculator/AppPackages/**/*.msix
          if-no-files-found: error
          retention-days: 14

  result:
    name: CI result
    if: always()
    needs: [repository, portable, regression-and-winui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          WINUI_RESULT: ${{ needs.regression-and-winui.result }}
        run: |
          foreach ($result in @($env:REPOSITORY_RESULT, $env:PORTABLE_RESULT, $env:WINUI_RESULT)) {
            if ($result -ne 'success') { throw "A required check did not succeed: $result" }
          }
