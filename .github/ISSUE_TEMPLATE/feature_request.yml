name: 功能建议
description: 提议新的能力或改进现有体验。
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 可以提供表达式示例、草图和验收条件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案