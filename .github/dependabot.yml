version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /ncalc
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /math
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      math-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
